<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    color: #fff;
    height: 100%;
    font-family: "Courier New", ui-monospace, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  canvas {
    border: 2px solid #fff;
    background: #000;
    display: block;
  }
  #side {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 140px;
  }
  .panel {
    border: 2px solid #fff;
    padding: 12px;
  }
  .panel h2 {
    font-size: 12px;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 8px;
    border-bottom: 1px solid #555;
    padding-bottom: 6px;
  }
  .panel .value {
    font-size: 24px;
    letter-spacing: 1px;
  }
  #nextCanvas {
    display: block;
    margin: 0 auto;
  }
  #help {
    font-size: 11px;
    line-height: 1.7;
    color: #aaa;
    letter-spacing: 1px;
  }
  #help b { color: #fff; font-weight: normal; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.85);
  }
  #overlay h1 {
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 12px;
    text-indent: 12px;
  }
  #overlay p {
    font-size: 13px;
    letter-spacing: 3px;
    color: #ccc;
    animation: blink 1.2s steps(2) infinite;
  }
  #overlay .ghost {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: #333;
  }
  @keyframes blink { 50% { opacity: 0.2; } }
  #boardWrap { position: relative; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="boardWrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <div class="ghost"></div>
        <h1>TETRIS</h1>
        <p id="overlayMsg">PRESS ANY KEY TO START</p>
      </div>
    </div>
    <div id="side">
      <div class="panel">
        <h2>SCORE</h2>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel">
        <h2>LEVEL</h2>
        <div class="value" id="level">1</div>
      </div>
      <div class="panel">
        <h2>LINES</h2>
        <div class="value" id="lines">0</div>
      </div>
      <div class="panel">
        <h2>NEXT</h2>
        <canvas id="nextCanvas" width="100" height="100"></canvas>
      </div>
      <div class="panel">
        <h2>KEYS</h2>
        <div id="help">
          <b>&larr; &rarr;</b> move<br>
          <b>&uarr;</b> rotate<br>
          <b>&darr;</b> soft drop<br>
          <b>SPACE</b> hard drop<br>
          <b>P</b> pause
        </div>
      </div>
    </div>
  </div>
<script src="game.js"></script>
</body>
</html>
